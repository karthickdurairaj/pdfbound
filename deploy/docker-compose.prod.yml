services:
  backend:
    image: ghcr.io/karthickdurairaj/pdfbound-backend:latest
    restart: unless-stopped
    environment:
      - PORT=8080
      - UPLOAD_DIR=/tmp/pdfbound-uploads
    volumes:
      - pdfbound-uploads:/tmp/pdfbound-uploads
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/api/health || exit 1"]
      interval: 15s
      retries: 5
      start_period: 20s

  frontend:
    image: ghcr.io/karthickdurairaj/pdfbound-frontend:latest
    restart: unless-stopped
    ports:
      # Host nginx on :80 reverse-proxies to this; bound to localhost only.
      - "127.0.0.1:8081:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  pdfbound-uploads: