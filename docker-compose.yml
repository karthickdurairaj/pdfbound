services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pdfbound-backend
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - UPLOAD_DIR=/tmp/pdfbound-uploads
    volumes:
      - pdfbound-uploads:/tmp/pdfbound-uploads
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: pdfbound-frontend
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  pdfbound-uploads:
